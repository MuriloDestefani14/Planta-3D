<!doctype html>
<html lang="pt-BR">

<meta name="theme-color" content="#2f6f8f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* Layout: cena 3D em tela cheia, cartão de título no canto superior esquerdo, barras de planta e vista embaixo */
  :root {
    --bg: #e9ecef;
    --sky: #dfe6ec;
    --panel: rgba(255,255,255,.88);
    --panel-line: #c9d0d6;
    --fg: #1f2a33;
    --muted: #56636e;
    --accent: #2f6f8f;
    --accent-fg: #ffffff;
    --font: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151a1f; --sky: #1d252c; --panel: rgba(28,35,42,.88); --panel-line: #33404a;
      --fg: #e6ebef; --muted: #9aa8b3; --accent: #6fb4d3; --accent-fg: #0f1a21; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151a1f; --sky: #1d252c; --panel: rgba(28,35,42,.88); --panel-line: #33404a;
    --fg: #e6ebef; --muted: #9aa8b3; --accent: #6fb4d3; --accent-fg: #0f1a21; color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #stage canvas:active { cursor: grabbing; }
  .card {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px));
    left: max(16px, env(safe-area-inset-left, 0px));
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 12px 16px; backdrop-filter: blur(6px); max-width: min(340px, calc(100vw - 32px));
  }
  .card h1 { font-size: 15px; font-weight: 700; margin: 0 0 4px; letter-spacing: .01em; }
  #ksub { margin-top: 6px !important; color: var(--fg); font-weight: 600; }
  .kl { align-self: center; padding: 0 8px 0 10px; font: 600 12px var(--font); color: var(--muted); }
  .card p { margin: 0; font-size: 12px; line-height: 1.45; color: var(--muted); }
  .card { display: none !important; }
  .bar {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    max-width: calc(100vw - 32px);
  }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 3px; gap: 2px; backdrop-filter: blur(6px); }
  .bar button {
    font: 600 13px var(--font); color: var(--fg); background: transparent; border: 0; border-radius: 7px;
    padding: 8px 14px; cursor: pointer;
  }
  .bar button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .bar button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ctl { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 8px; z-index: 5; }
  .ctl button { font: 600 13px var(--font); color: var(--fg); background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 9px 14px; cursor: pointer; backdrop-filter: blur(6px); }
  .ctl button:hover { background: color-mix(in srgb, var(--accent) 18%, var(--panel)); }
  .ctl button[aria-pressed="true"]#t-walk { background: var(--accent); color: var(--accent-fg); }
  body.nomenu .bar, body.nomenu .hint { display: none; }
  [hidden] { display: none !important; }
  #joy { position: fixed; left: 18px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 112px; border-radius: 50%; background: rgba(255,255,255,.22); border: 2px solid rgba(255,255,255,.75); touch-action: none; }
  #knob { position: absolute; left: 36px; top: 36px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .hint {
    position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(12px + env(safe-area-inset-top, 0px));
    font-size: 11px; color: var(--muted); text-align: right; line-height: 1.5; max-width: 190px;
  }
  @media (max-width: 640px) { .hint { display: none; } }
</style>

</head>
<body>
<div id="stage" aria-label="Maquete 3D da planta"></div>
<div class="card">
  <h1 id="ttl">Planta 1</h1>
  <p id="sub"></p>
  <p id="ksub"></p>
</div>
<div class="hint">Arraste para girar<br>Role para aproximar<br>Botão direito para mover</div>
<div class="ctl"><button id="t-menu" aria-pressed="true" title="Mostrar ou ocultar os botões">Ocultar menu</button><button id="t-walk" aria-pressed="false" title="Andar dentro da casa em primeira pessoa">Caminhar</button></div>
<div id="joy" hidden><div id="knob"></div></div>
<div class="bar">
  <div class="seg" role="group" aria-label="Planta">
    <button id="p-4" aria-pressed="true">Planta (descoberta)</button>
    <button id="p-5" aria-pressed="false">Planta (coberta)</button>
  </div>
  <div class="seg" role="group" aria-label="Pontos de vista" hidden>
    <button id="v-iso" aria-pressed="true">Vista 3D</button>
    <button id="v-top" aria-pressed="false">De cima</button>
    <button id="v-3rd" aria-pressed="false">Por dentro</button>
  </div>
  <div class="seg" id="kseg" hidden role="group" aria-label="Layout da cozinha"><span class="kl">Cozinha</span><button id="k-A" aria-pressed="false">A</button><button id="k-B" aria-pressed="false">B</button><button id="k-C" aria-pressed="false">C</button><button id="k-D" aria-pressed="false">D</button><button id="k-E" aria-pressed="false">E</button><button id="k-F" aria-pressed="false">F</button><button id="k-G" aria-pressed="false">G</button><button id="k-H" aria-pressed="false">H</button><button id="k-I" aria-pressed="true">I</button></div>
  <div class="seg"><button id="t-labels" aria-pressed="false">Nomes</button><button id="t-door" aria-pressed="false" title="Abrir ou fechar a porta de correr entre a sala e a cozinha" hidden>Porta ripada</button><button id="t-roof" aria-pressed="true" title="Mostrar ou esconder o telhado da garagem" hidden>Telhado</button><button id="t-ent" aria-pressed="true" title="Abrir ou fechar a porta de entrada de madeira" hidden>Porta de entrada</button><button id="t-cor" aria-pressed="false" title="Abrir ou fechar a porta de correr do corredor" hidden>Porta do corredor</button><button id="t-main" aria-pressed="false" title="Abrir ou fechar a porta principal de 4 folhas" hidden>Porta principal</button></div>
</div>

<script src="libs/three.min.js"></script>
<script src="libs/OrbitControls.js"></script>
<script>
(function () {
  // Cada planta tem a sua escala (px da imagem por metro). A planta 3 foi convertida para a escala da planta 2.
  const PLANS = {
    1: { S: 27.5, OX: 530, OY: 385, T: 0.2, focus: { cx: 530, cy: 452, w: 21, h: 17 }, third: 'Por dentro' },
    2: { S: 37.9, OX: 419, OY: 760, T: 0.18, focus: { cx: 419, cy: 752, w: 20, h: 27.5 }, third: 'Garagem' },
    3: { S: 37.9, OX: 419, OY: 760, T: 0.18, focus: { cx: 419, cy: 752, w: 20, h: 27.5 }, third: 'Garagem' },
    4: { S: 37.9, OX: 419, OY: 760, T: 0.18, focus: { cx: 419, cy: 752, w: 20, h: 27.5 }, third: 'Garagem' },
    5: { S: 37.9, OX: 419, OY: 760, T: 0.18, focus: { cx: 419, cy: 752, w: 20, h: 27.5 }, third: 'Garagem' }
  };
  const SUB = {
    1: 'Casa com sala, dois quartos, banheiro, cozinha em U e varanda, com os móveis da planta. Sem telhado.',
    2: 'Casa mobiliada, garagem aberta e escura, piscina vertical de 2,8 × 6,3 m e área de churrasco com banheiro, lavanderia, mesa de jantar e bilhar. Sem telhado.',
    3: 'Casa mobiliada, garagem aberta em L e escura, piscina horizontal de 5,7 × 3,0 m e área de churrasco com banheiro, lavanderia, mesa de jantar e bilhar. Sem telhado.'
  };
  let S = 27.5, OX = 530, OY = 385, T = 0.2; const H = 2.8;
  const mx = px => (px - OX) / S;
  const mz = py => (py - OY) / S;
  const K3 = 43.8 / 37.9;
  const p3 = (x, y) => [125 + (x - 125) / K3, 249 + (y - 57) / K3];

  const stage = document.getElementById('stage');
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.maxPolarAngle = Math.PI / 2 - 0.02; controls.minDistance = 1; controls.maxDistance = 110;

  function applySky() {
    const c = getComputedStyle(document.documentElement).getPropertyValue('--sky').trim() || '#dfe6ec';
    scene.background = new THREE.Color(c);
  }
  applySky();
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applySky); } catch (e) {}
  new MutationObserver(applySky).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8a7c, 0.62));
  const sun = new THREE.DirectionalLight(0xfff4e0, 0.7);
  sun.position.set(14, 32, 18); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  const sc = sun.shadow.camera; sc.left = -24; sc.right = 24; sc.top = 30; sc.bottom = -30; sc.near = 1; sc.far = 90;
  sun.shadow.bias = -0.0004;
  scene.add(sun); sun.target.position.set(0, 0, 0); scene.add(sun.target);

  // ---------- materiais ----------
  const M = (c, r, extra) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: r == null ? .9 : r, metalness: 0 }, extra || {}));
  const mats = {
    wall: M(0xf2eee7), lot: M(0xd8d2c5), grass: M(0x93b27d, 1), street: M(0xc7c9c4, 1),
    tile: M(0x8f9295, .6), tileLight: M(0xc9cbcd, .45), wood: M(0xb98258, .6), garage: M(0x4a4846, .95),
    rugA: M(0xb7a58f, 1), rugB: M(0x9aaeb8, 1), rugC: M(0xcdbfb0, 1), wardrobe: M(0xd3cabb, .6), screen: M(0x0e1013, .25),
    counterK: M(0x9aa1a8, .4), sinkM: M(0x9aa1a8, .25, { metalness: .6 }),
    leather: M(0x4a2e22, .55), leatherLight: M(0x5d3b2b, .5),
    ledGlow: M(0xfff3c8, .5, { emissive: 0xffe2a0, emissiveIntensity: .9 }),
    panelBlack: M(0x15171a, .7), tvFrame: M(0x2b2f34, .4),
    masonry: M(0xd6d0c4, .95), sand: M(0xe4d6ae, 1), rock: M(0x6f6a64, .9),
    aquaGlass: M(0x9fd8ee, .05, { transparent: true, opacity: .2, depthWrite: false }),
    aquaWater: M(0x3aa6d6, .1, { transparent: true, opacity: .32, depthWrite: false }),
    pot: M(0x7b4e38, .8), leaf: M(0x3f7d46, 1), cushion: M(0xe6d5b8, .9), lamp: M(0xf3e6c4, .9),
    floorMain: M(0xd9d3c8, .7), floorWood: M(0xc49a6c, .6), floorGourmet: M(0xbdbab3, .7), floorTile: M(0xc8c3b9, .5),
    floorBath: M(0xb4c3c9, .45), deck: M(0x9a7550, .8),
    glass: M(0xaed6ea, .1, { transparent: true, opacity: .3, depthWrite: false }),
    frame: M(0x3b3f44, .5), door: M(0x8a6240, .6), handle: M(0xc9ccd0, .3, { metalness: .8 }),
    water: M(0x1a96dc, .12, { transparent: true, opacity: .93, metalness: .1 }), poolWall: M(0x4fb4de, .5),
    copingLight: M(0xe4e1d9, .8), copingDark: M(0x4d5662, .7),
    paintBlack: M(0x17181a, .25, { metalness: .5 }), paintWhite: M(0xeceae4, .3, { metalness: .3 }),
    carGlass: M(0x14202a, .1, { metalness: .6 }), tyre: M(0x0f0f10, .9), head: M(0xfff6d6, .3), tail: M(0xc41e1e, .4),
    brick: M(0xa5523a, .95), stone: M(0x3b3d40, .35), cabinet: M(0xe6e1d8, .6),
    steel: M(0xb9bec4, .35, { metalness: .6 }), steelDark: M(0x7d838a, .35, { metalness: .6 }),
    woodDark: M(0x6b4a30, .6), furnWood: M(0xa8794e, .6), chair: M(0x474b51, .7), black: M(0x1c1d1f, .5),
    fabric: M(0x6b7d8b, 1), fabricLight: M(0x7c8f9d, 1), white: M(0xf6f4ef, .8), counter: M(0x383b3f, .4),
    ceramic: M(0xfbfbf9, .25), blanketA: M(0x6f9585, 1), blanketB: M(0xc79b82, 1), shower: M(0xe9eef0, .4),
    cloth: M(0x1f7a4d, .95), cue: M(0xd9b27c, .5), chalk: M(0x3a7bd5, .8)
  };
  (function () {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512; const x = c.getContext('2d');
    x.fillStyle = '#141517'; x.fillRect(0, 0, 512, 512);
    let sd = 3; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 2600; i++) {
      const g = 70 + Math.floor(rnd() * 150), a = (.05 + rnd() * .2).toFixed(2), z = rnd() > .93 ? 2 : 1;
      x.fillStyle = rnd() > .9 ? 'rgba(120,96,70,' + a + ')' : 'rgba(' + g + ',' + g + ',' + g + ',' + a + ')';
      x.fillRect(rnd() * 512, rnd() * 512, z, z);
    }
    mats.marble = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(c), roughness: .16, metalness: .08 });
    const t = document.createElement('canvas'); t.width = 256; t.height = 256; const y = t.getContext('2d');
    y.fillStyle = '#e6eef1'; y.fillRect(0, 0, 256, 256); y.strokeStyle = '#a9b8be'; y.lineWidth = 2;
    for (let i = 0; i <= 8; i++) { y.beginPath(); y.moveTo(i * 32, 0); y.lineTo(i * 32, 256); y.stroke(); y.beginPath(); y.moveTo(0, i * 32); y.lineTo(256, i * 32); y.stroke(); }
    mats.azulejo = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(t), roughness: .25 });
    (function () {
      const d = document.createElement('canvas'); d.width = 512; d.height = 512; const z = d.getContext('2d');
      let sd = 17; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
      const rows = 26, h = 512 / rows;
      z.fillStyle = '#2b1d12'; z.fillRect(0, 0, 512, 512);
      for (let i = 0; i < rows; i++) {
        let x = -rnd() * 200;
        while (x < 512) {
          const w = 150 + rnd() * 190, k = 150 + Math.floor(rnd() * 28);
          z.fillStyle = 'rgb(' + k + ',' + Math.floor(k * .68) + ',' + Math.floor(k * .42) + ')';
          z.fillRect(x + 2, i * h + 3, w - 3, h - 6);
          z.strokeStyle = 'rgba(70,40,20,.25)'; z.lineWidth = 1;
          for (let g = 0; g < 3; g++) { const gy = i * h + 5 + rnd() * (h - 10); z.beginPath(); z.moveTo(x + 4, gy); z.lineTo(x + w - 4, gy); z.stroke(); }
          x += w;
        }
      }
      mats.deckSlat = new THREE.MeshStandardMaterial({ map: new THREE.CanvasTexture(d), roughness: .75 });
    })();
    mats.rustic = M(0x2a1a10, .92); mats.islandWood = M(0x3a2312, .78); mats.rusticLt = M(0x4a2f1c, .88); mats.closetWood = M(0x3a2518, .6); mats.deskBlack = M(0x1d1f22, .35);
  })();
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x8f897e, transparent: true, opacity: .55 });
  const ballMats = [0xf2c300, 0x1f4fbf, 0xd0312d, 0x6b2d90, 0xf47c20, 0x1f8f4a, 0x7a1f1f, 0x111111].map(c => M(c, .25, { metalness: .1 }));
  const cueBall = M(0xfbfbf6, .25);

  // ---------- helpers ----------
  let world = null, colliders = [];
  function addBox(w, h, d, x, y0, z, mat, o) {
    o = o || {};
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
    m.position.set(x, y0 + h / 2, z);
    m.castShadow = !o.noShadow; m.receiveShadow = true;
    (o.parent || world).add(m);
    if (!o.parent && h >= .6 && y0 < .5 && w >= .15 && d >= .15) colliders.push([x - w / 2, x + w / 2, z - d / 2, z + d / 2]);
    if (o.edges) m.add(new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), edgeMat));
    return m;
  }
  function rect(px0, py0, px1, py1, h, y0, mat, o) {
    return addBox((px1 - px0) / S, h, (py1 - py0) / S, mx((px0 + px1) / 2), y0, mz((py0 + py1) / 2), mat, o);
  }
  function cyl(rt, rb, h, x, y0, z, mat, seg, parent) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20), mat);
    m.position.set(x, y0 + h / 2, z); m.castShadow = true; m.receiveShadow = true;
    (parent || world).add(m); return m;
  }
  function wall(x1, y1, x2, y2, opens, o) {
    o = o || {}; opens = opens || [];
    const t = o.t || T, h = o.h || H, mat = o.mat || mats.wall;
    const horiz = y1 === y2;
    const a0 = horiz ? Math.min(x1, x2) : Math.min(y1, y2);
    const a1 = horiz ? Math.max(x1, x2) : Math.max(y1, y2);
    const toM = horiz ? mx : mz;
    const cm = horiz ? mz(y1) : mx(x1);
    const seg = (s, e, yb, yt) => {
      const len = e - s; if (len < 0.005 || yt - yb < 0.005) return;
      const mid = (s + e) / 2;
      if (horiz) addBox(len, yt - yb, t, mid, yb, cm, mat, { edges: true });
      else addBox(t, yt - yb, len, cm, yb, mid, mat, { edges: true });
    };
    const bar = (s, e, yb, yt, th) => {
      const len = e - s, mid = (s + e) / 2, f = th || 0.05;
      if (horiz) addBox(len, yt - yb, f, mid, yb, cm, mats.frame, { noShadow: true });
      else addBox(f, yt - yb, len, cm, yb, mid, mats.frame, { noShadow: true });
    };
    const pane = (s, e, yb, yt) => {
      const len = e - s, mid = (s + e) / 2;
      const g = new THREE.Mesh(horiz ? new THREE.BoxGeometry(len, yt - yb, 0.02) : new THREE.BoxGeometry(0.02, yt - yb, len), mats.glass);
      if (horiz) g.position.set(mid, yb + (yt - yb) / 2, cm); else g.position.set(cm, yb + (yt - yb) / 2, mid);
      g.renderOrder = 2; world.add(g);
    };
    let cur = toM(a0) - t / 2;
    const end = toM(a1) + t / 2;
    opens.slice().sort((p, q) => p.a - q.a).forEach(op => {
      const s = toM(op.a), e = toM(op.b), type = op.type || 'gap';
      seg(cur, s, 0, h);
      if (type === 'window') {
        const sill = op.sill != null ? op.sill : 1.0, top = op.top != null ? op.top : 2.2;
        seg(s, e, 0, sill); seg(s, e, top, h);
        pane(s, e, sill, top);
        bar(s, e, sill, sill + .05); bar(s, e, top - .05, top);
        bar(s, s + .05, sill, top); bar(e - .05, e, sill, top);
        const n = Math.max(1, Math.round((e - s) / 1.1));
        for (let i = 1; i < n; i++) bar(s + (e - s) * i / n - .02, s + (e - s) * i / n + .02, sill, top, .04);
      } else {
        const top = op.top != null ? op.top : 2.1;
        seg(s, e, top, h);
        if (type === 'slide') {
          // porta de correr: folha (madeira ou vidro) meio aberta, correndo por fora da parede, com trilho no alto
          const len = e - s, ll = len * (op.r || .55), off = (op.o || 1) * (t / 2 + .035), lh = 2.05, y0 = .02;
          const lc = (op.side || 1) > 0 ? e - ll / 2 : s + ll / 2;
          const box = (al, hh, pp, ac, yb, mat, ns) => horiz ? addBox(al, hh, pp, ac, yb, cm + off, mat, { noShadow: !!ns }) : addBox(pp, hh, al, cm + off, yb, ac, mat, { noShadow: !!ns });
          if (op.mat === 'glass') {
            const p = box(ll - .08, lh - .08, .02, lc, y0 + .04, mats.glass, true); p.renderOrder = 2;
            box(ll, .05, .05, lc, y0 + lh - .05, mats.frame, true); box(ll, .05, .05, lc, y0, mats.frame, true);
            box(.05, lh, .05, lc - ll / 2 + .025, y0, mats.frame, true); box(.05, lh, .05, lc + ll / 2 - .025, y0, mats.frame, true);
